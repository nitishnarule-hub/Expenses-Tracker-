<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expenses Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <header>
      <h1>Expenses Tracker</h1>
      <div class="total" id="totalExpenses">₹0.00</div>
    </header>

    <section class="form-section">
      <h2 style="margin-bottom: 20px; color: #555;">Add New Expense</h2>
      <form id="expenseForm">
        <div class="form-row">
          <div class="form-group">
            <label for="description">Description</label>
            <input type="text" id="description" required placeholder="e.g., Grocery shopping">
          </div>
          <div class="form-group">
            <label for="amount">Amount (₹)</label>
            <input type="number" id="amount" step="0.01" required placeholder="0.00" min="0">
          </div>
          <div class="form-group">
            <label for="date">Date</label>
            <input type="date" id="date" required>
          </div>
        </div>
        <div class="form-group">
          <label for="category">Category (Optional)</label>
          <select id="category">
            <option value="">Select Category</option>
            <option value="Food">Food</option>
            <option value="Transport">Transport</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Bills">Bills</option>
            <option value="Shopping">Shopping</option>
            <option value="Medical">Medical</option>
            <option value="Education">Education</option>
            <option value="Travel">Travel</option>
            <option value="Savings">Savings</option>
            <option value="Rent">Rent</option>
            <option value="Subscriptions">Subscriptions</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit" class="add-btn">Add Expense</button>
      </form>
    </section>

    <section class="expenses-section">
      <h2 style="margin-bottom: 20px; color: #555;">Your Expenses</h2>
      <ul class="expenses-list" id="expensesList">
        <li class="no-expenses">No expenses added yet. Start tracking!</li>
      </ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
